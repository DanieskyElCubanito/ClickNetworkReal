<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- Evita parpadeos blancos en la barra de estado del celular -->
    <meta name="theme-color" content="#0a0314" />

    <title>Red Neón ⚡</title>

    <!-- 1. Telegram Web App SDK (Carga prioritaria) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- 2. Cloudflare Turnstile -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <!-- 3. Monetización Giga Pub (Cuenta nueva sin auto-popups) -->
    <script src="https://ad.gigapub.tech/script?id=8567"></script>

    <style>
      /* FONDO NEÓN Y SCROLL DESBLOQUEADO */
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #0a0314;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

        /* Bloqueamos el rebote nativo de iOS/Android pero PERMITIMOS el deslizamiento táctil */
        overflow: hidden; 
        touch-action: pan-y; 
      }

      #root {
        height: 100%;
      }

      /* Pantalla de carga inicial (Antes de que React despierte) */
      #fallback-loader {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
        background-color: #0a0314;
        background-image: radial-gradient(circle at center, #260b3f 0%, #0a0314 85%);
      }

      /* Círculo de carga con brillo Neón */
      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 65, 180, 0.2);
        border-top-color: #00f0ff;
        border-right-color: #ff1493;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .fade-in {
        animation: fadeIn 0.4s ease-out;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="fallback-loader">
        <div class="spinner"></div>
        <p style="margin-top: 20px; font-size: 14px; font-weight: 900; color: #ff66cc; letter-spacing: 1px;">CARGANDO Click Network...</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
